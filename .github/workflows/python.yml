name: Python CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/promethium_seismic/**'
      - 'tests/**'
      - 'pyproject.toml'
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # dev carries the tooling, ml carries torch. Without ml the
        # model tests skip, and a suite that skips its own subject is
        # not a suite.
        pip install -e ".[dev,ml]"
    
    - name: Lint with ruff
      run: |
        pip install ruff
        ruff check src/promethium_seismic
    
    - name: Type check with mypy
      run: |
        pip install mypy
        # Reporting only here: this job runs on 3.10 and 3.11 too, where
        # numpy's stubs cannot be parsed. The gating type check is in
        # ci.yml, on 3.12.
        mypy src/promethium_seismic
      continue-on-error: true
    
    - name: Test with pytest
      run: |
        pytest tests/ -v --cov=promethium_seismic --cov-report=xml
    
    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Build package
      run: |
        pip install build
        python -m build
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
