[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "promethium-seismic"
version = "1.0.4"
description = "Promethium - Advanced Seismic Data Recovery and Reconstruction Framework. State-of-the-art AI-driven framework for seismic signal reconstruction, denoising, and geophysical data enhancement."
authors = [{name = "Olaf Yunus Laitinen Imanov", email = "contact@promethium.dev"}]
readme = "README.md"
license = "MPL-2.0"
requires-python = ">=3.10"
keywords = [
    "seismic",
    "geophysics",
    "reconstruction",
    "deep-learning",
    "signal-processing",
    "pytorch",
    "machine-learning",
    "earthquake",
    "seismic-data",
    "denoising",
    "data-recovery",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

# Core dependencies.
#
# What it takes to load seismic arrays, filter them, reconstruct missing
# traces and score the result. Nothing here is larger than a few megabytes,
# so `pip install promethium-seismic` is a quick install on a laptop or in a
# slim container.
#
# Everything that is heavy or optional is an extra below, and the package
# tells you which one you need at the point you need it rather than failing
# at import with a name you have never heard of.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "PyWavelets>=1.4.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Seismic file formats and the wider array stack. segyio and obspy are the
# two standard readers; zarr and xarray back the chunked array store.
io = [
    "segyio>=1.9.0",
    "obspy>=1.4.0",
    "xarray>=2023.0",
    "zarr>=2.12.0",
    "pandas>=2.0",
]

# Deep learning. This is the two and a half gigabytes, and it is optional
# because the classical reconstruction methods do not need it.
ml = [
    "torch>=2.0.0",
    "scikit-learn>=1.2.0",
    "tqdm>=4.65.0",
]

# Plotting.
viz = [
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]

# The command line interface.
cli = [
    "typer>=0.9.0",
    "rich>=13.0.0",
]

# The HTTP API and its storage layer.
server = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.22.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.19.0",
    "asyncpg>=0.29.0",
    "python-multipart>=0.0.6",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "psutil>=5.9.0",
    "requests>=2.25.0",
]

# Distributed job execution.
workflows = [
    "celery>=5.3.0",
    "redis>=4.6.0",
]

# Object storage backends.
cloud = [
    "boto3>=1.28.0",
    "azure-storage-blob>=12.17.0",
]

# Development and testing.
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.0.270",
    "mypy>=1.3.0",
    "httpx>=0.24.0",
    "build>=1.0.4",
    "twine>=4.0.0",
    "scikit-image>=0.22.0",
]

# Everything a user might want, which is not the same as everything a
# developer needs. The name is the distribution name, not the import name:
# the old table said promethium[...] and resolved to a different project.
all = [
    "promethium-seismic[io,ml,viz,cli,server,workflows,cloud]",
]

[project.scripts]
promethium = "promethium.cli:main"

[project.urls]
Homepage = "https://github.com/olaflaitinen/Promethium"
Documentation = "https://github.com/olaflaitinen/Promethium#readme"
Repository = "https://github.com/olaflaitinen/Promethium"
Issues = "https://github.com/olaflaitinen/Promethium/issues"
Changelog = "https://github.com/olaflaitinen/Promethium/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["promethium*"]

[tool.setuptools.package-data]
promethium = ["py.typed"]

[tool.ruff]
line-length = 88
target-version = "py310"
select = ["E", "F", "I", "B", "UP"]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
