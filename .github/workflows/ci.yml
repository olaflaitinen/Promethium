name: Promethium CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    # 3.12 because numpy ships stubs written in PEP 695 syntax and
    # mypy will not parse them when targeting an older Python. The
    # test matrix below still covers 3.10 through 3.12.
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        # The package and its extras, not just the tools. mypy with
        # nothing installed sees every array operation as Any and
        # reports a clean run that checked nothing.
        pip install -e ".[dev,ml,viz]"
        pip install ruff mypy
        
    - name: Lint with Ruff
      run: |
        ruff check src tests
        
    - name: Check formatting
      run: |
        ruff format --check src tests
        
    - name: Type check with Mypy
      run: |
        # No flags: the settings live in pyproject.toml, where each
        # one carries the reason it is set.
        mypy src

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,ml]"
        
    - name: Run Tests
      run: |
        pytest tests/ -v --cov=promethium_seismic --cov-report=xml
        
    - name: Upload coverage
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  build-package:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        
    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build twine
        
    - name: Build package
      run: |
        python -m build
        
    - name: Check package with twine
      run: |
        twine check dist/*
        
    # What a wheel has to prove: it installs on a machine with only the
    # core dependencies, and it works. The previous version imported
    # `promethium`, which is a different project on PyPI, and reached for
    # read_segy and SeismicRecoveryPipeline, which live behind the io and ml
    # extras and are not installed here.
    #
    # The checks live in a committed script rather than in a chain of
    # python -c lines, so the same acceptance test can be run by hand
    # against any wheel.
    - name: Test installation
      run: |
        pip install dist/*.whl
        cd "$(mktemp -d)"
        python "$GITHUB_WORKSPACE/scripts/smoke_install.py"

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

